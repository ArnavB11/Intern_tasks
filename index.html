<!DOCTYPE html>
<html>
    <head>
        <title>Javascript form Task</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
                color: #333;
                margin: 0;
                padding: 40px 20px;
                min-height: 100vh;
                box-sizing: border-box;
            }

            .main-container {
                max-width: 500px;
                margin: 0 auto;
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            }

            input[type="text"], textarea {
                padding: 12px;
                margin: 8px 5px;
                border: 1px solid #ccc;
                border-radius: 6px;
                font-size: 14px;
                width: 220px;
                box-sizing: border-box;
                outline: none;
                transition: border-color 0.2s;
            }

            textarea {
                width: 100%;
                height: 70px;
                resize: none;
                margin-top: 8px;
            }

            button {
                padding: 12px 20px;
                border: none;
                border-radius: 6px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            button[onclick="SubmitForm()"], button[onclick="SaveAllDetails()"] {
                background-color: #007bff;
                color: white;
            }
            button[onclick="SubmitForm()"]:hover, button[onclick="SaveAllDetails()"]:hover {
                background-color: #0056b3;
            }

            button[onclick="CloseModal()"] {
                background-color: red;
                color: white;
            }
            button[onclick="CloseModal()"]:hover {
                background-color: darkred;
            }

            #output {
                text-align: center;
                font-size: 16px;
                line-height: 1.6;
                margin-top: 15px;
                background-color: #f8f9fa;
                padding: 15px;
                border-radius: 8px;
                border: 1px dashed #ccc;
                overflow-wrap: break-word; 
                word-break: break-word;    
            }

            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(8px);
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .modal-box {
                background: white;
                padding: 24px;
                border-radius: 12px;
                width: 90%;               
                max-width: 480px;         
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            }

            .modal-box h2 {
                margin-top: 0;
                font-size: 20px;
            }

            #modalSummary {
                background-color: #f0f2f5;
                padding: 12px;
                border-radius: 6px;
                margin: 15px 0;
                font-size: 14px;
                line-height: 1.5;
            }

            .additional_input {
                margin-bottom: 20px;
            }

            .modal-actions {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
            }

            .hidden {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <div class="main-container">
            <h1 style="text-align: center; margin-top: 0;">Form</h1>
            <form align="center">
                <input type="text" id="name" required placeholder="Enter your name"></input>
                <input type="text" id="age" required placeholder="Enter your age"></input>
                <button type="button" onclick="SubmitForm()">Submit</button>
            </form>

            <h3 style="text-align: center; margin-top: 30px;">Values entered:</h3>
            <div id="output">No details saved yet.</div>
        </div>
        
        <div id="modalOverlay" class="overlay hidden">
            <div class="modal-box">
                <h2>Review Details</h2>
                <p style="font-size: 14px; color: #666;">Here is what you entered:</p>

                <div id="modalSummary"></div>

                <div class="additional_input">
                    <label for="extra" style="font-size: 14px;"><strong>Add Additional Details:</strong></label>
                    <textarea id="extra" placeholder="Type any extra info here"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" onclick="CloseModal()">Cancel</button>
                    <button type="button" onclick="SaveAllDetails()">Save & Finalize</button>
                </div>
            </div>
        </div>

        <script>
            let tempName = "";
            let tempAge = "";

            function SubmitForm() {
                tempName = document.getElementById("name").value;
                tempAge = document.getElementById("age").value;
                if (!tempName || !tempAge) {
                    alert("Please fill out both Name and Age fields first!");
                    return;
                }
                document.getElementById("modalSummary").innerHTML = "<strong>Name:</strong> " + tempName + "<br><strong>Age:</strong> " + tempAge;
                document.getElementById("modalOverlay").classList.remove("hidden");
            }

            function CloseModal() {
                document.getElementById("extra").value = "";
                document.getElementById("modalOverlay").classList.add("hidden");
            }

            function SaveAllDetails() {
                const extraDetails = document.getElementById("extra").value;

                let finalOutput = "<strong>Name:</strong> " + tempName + "<br><strong>Age:</strong> " + tempAge;
                if (extraDetails.trim() !== "") {
                    finalOutput += "<br><strong>Additional Info:</strong> " + extraDetails;
                }

                document.getElementById("output").innerHTML = finalOutput;
                CloseModal();
            }
        </script>
    </body>
</html>
